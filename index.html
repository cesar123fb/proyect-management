                                            <div className="flex justify-between items-center">
                                                <label className="block text-xs font-bold text-slate-600 uppercase tracking-wider">Empresas Vinculadas</label>
                                                <button type="button" onClick={handleAddEmpresa} className="text-xs bg-indigo-100 text-indigo-700 px-3 py-1 rounded-md hover:bg-indigo-200 font-bold"><i className="fa-solid fa-plus"></i> Añadir</button>
                                            </div>
                                            {clientFormData.empresas.map((emp, idx) => (
                                                <div key={idx} className="flex gap-2 items-center">
                                                    <input type="text" value={emp} onChange={(e) => handleEmpresaChange(idx, e.target.value)} placeholder="Nombre comercial / Empresa" className="w-full p-2 text-sm rounded-lg border border-slate-200 bg-white" />
                                                    <button type="button" onClick={() => handleRemoveEmpresa(idx)} className="text-red-400 p-2 hover:bg-red-50 rounded"><i className="fa-solid fa-trash"></i></button>
                                                </div>
                                            ))}
                                        </div>
                                        <div className="pt-4 border-t border-slate-100 flex justify-end gap-3">
                                            <button type="button" onClick={() => goTo('clients')} className="px-6 py-2 rounded-lg border border-slate-200 text-slate-600">Cancelar</button>
                                            <button type="submit" className="px-6 py-2 rounded-lg bg-indigo-600 text-white">Guardar</button>
                                        </div>
                                    </form>
                                </div>
                            )}

                            {/* FINANZAS */}
                            {view === 'finances' && (
                                <div className="space-y-6">
                                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                                        <h2 className="text-xl font-bold text-slate-700 flex items-center gap-2"><i className="fa-solid fa-chart-pie text-indigo-500"></i> Finanzas</h2>
                                        <div className="flex gap-2 w-full sm:w-auto">
                                            <select value={financeClientFilter} onChange={(e) => setFinanceClientFilter(e.target.value)} className="p-2 rounded-lg border border-slate-200 bg-white text-sm">
                                                <option value="Todos">Todos los clientes y empresas</option>
                                                {financeFilterOptions.map(c => <option key={c} value={c}>{c}</option>)}
                                            </select>
                                            <button onClick={() => setShowFinances(!showFinances)} className="bg-slate-100 hover:bg-slate-200 text-slate-600 px-4 py-2 rounded-lg flex items-center gap-2 transition-colors border border-slate-200 text-sm font-medium">
                                                {showFinances ? <><i className="fa-solid fa-eye-slash"></i> Ocultar</> : <><i className="fa-solid fa-eye"></i> Mostrar</>}
                                            </button>
                                            <button onClick={() => handlePrintFinance('all')} className="bg-slate-800 hover:bg-slate-700 text-white px-3 py-2 rounded-lg flex items-center gap-1 text-xs font-medium shadow-sm"><i className="fa-solid fa-file-pdf"></i> PDF Total</button>
                                            <button onClick={() => handlePrintFinance('pending')} className="bg-orange-600 hover:bg-orange-700 text-white px-3 py-2 rounded-lg flex items-center gap-1 text-xs font-medium shadow-sm"><i className="fa-solid fa-file-pdf"></i> PDF Deudas</button>
                                        </div>
                                    </div>
                                    
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                                            <h3 className="text-slate-500 font-medium mb-1">Total Facturado</h3>
                                            <p className={`text-3xl font-bold text-slate-800 ${showFinances ? '' : 'blur-md select-none transition-all'}`}>
                                                S/ {orders.filter(o => o.estado !== 'Cancelado').filter(isFinanceMatch).reduce((sum, o) => sum + o.costoTotal, 0).toFixed(2)}
                                            </p>
                                        </div>
                                        <div className="bg-orange-50 p-6 rounded-xl shadow-sm border border-orange-100">
                                            <h3 className="text-orange-800 font-medium mb-1">Total Pendiente de Cobro</h3>
                                            <p className={`text-3xl font-bold text-orange-600 ${showFinances ? '' : 'blur-md select-none transition-all'}`}>
                                                S/ {orders.filter(o => o.estado === 'Pendiente').filter(isFinanceMatch).reduce((sum, o) => sum + (o.costoTotal - o.adelanto), 0).toFixed(2)}
                                            </p>
                                        </div>
                                    </div>

                                    {/* TABLA DE FINANZAS RESTAURADA */}
                                    <div className="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden mt-6">
                                        <div className="p-4 bg-slate-50 border-b border-slate-100">
                                            <h3 className="font-bold text-slate-700">Desglose de Órdenes</h3>
                                        </div>
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-left border-collapse min-w-[600px]">
                                                <thead>
                                                    <tr className="bg-white text-slate-500 text-sm border-b border-slate-100">
                                                        <th className="p-4 font-medium">Orden</th>
                                                        <th className="p-4 font-medium">Cliente</th>
                                                        <th className="p-4 font-medium text-right">Costo Total</th>
                                                        <th className="p-4 font-medium text-right">Abonado</th>
                                                        <th className="p-4 font-medium text-right">Pendiente</th>
                                                        <th className="p-4 font-medium text-center">Estado</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {orders.filter(isFinanceMatch).map(o => {
                                                        const pendiente = o.costoTotal - o.adelanto;
                                                        return (
                                                            <tr key={o.id} className="border-b border-slate-50 hover:bg-slate-50 transition-colors">
                                                                <td className="p-4 text-sm font-medium text-indigo-600">{o.id}</td>
                                                                <td className="p-4 text-sm text-slate-800">{o.cliente} {o.empresa && <span className="text-xs text-slate-500 block">{o.empresa}</span>}</td>
                                                                <td className={`p-4 text-sm text-right ${showFinances ? 'text-slate-600' : 'blur-sm select-none'}`}>S/ {o.costoTotal.toFixed(2)}</td>
                                                                <td className={`p-4 text-sm text-right ${showFinances ? 'text-emerald-600' : 'blur-sm select-none'}`}>S/ {o.adelanto.toFixed(2)}</td>
                                                                <td className={`p-4 text-sm text-right font-bold ${showFinances ? (pendiente > 0 ? 'text-orange-600' : 'text-slate-400') : 'blur-sm select-none'}`}>
                                                                    S/ {pendiente.toFixed(2)}
                                                                </td>
                                                                <td className="p-4 text-center">
                                                                    <span className={`text-xs px-2 py-1 rounded-full ${o.estado === 'Pendiente' ? 'bg-orange-100 text-orange-700' : o.estado === 'Completado' ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700'}`}>
                                                                        {o.estado}
                                                                    </span>
                                                                </td>
                                                            </tr>
                                                        );
                                                    })}
                                                    {orders.filter(isFinanceMatch).length === 0 && (
                                                        <tr>
                                                            <td colSpan="6" className="p-8 text-center text-slate-400 italic">No hay órdenes para mostrar con este filtro.</td>
                                                        </tr>
                                                    )}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* CONTROL DE INGRESOS MENSUALES */}
                            {view === 'income' && (
                                <div className="space-y-6">
                                    <div className="flex flex-col sm:flex-row justify-between items-center gap-4 bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                                        <h2 className="text-xl font-bold text-slate-700 flex items-center gap-2"><i className="fa-solid fa-money-bill-wave text-emerald-500"></i> Historial Mensual</h2>
                                        <input type="month" value={incomeMonth} onChange={(e) => setIncomeMonth(e.target.value)} className="p-2 rounded-lg border border-slate-200 font-bold text-slate-700 text-sm" />
                                    </div>
                                    <div className="bg-gradient-to-r from-emerald-500 to-teal-500 rounded-xl shadow-md p-6 text-white text-center">
                                        <h3 className="text-emerald-100 text-sm mb-1">Recaudado Neto del Mes</h3>
                                        <p className="text-4xl font-black">S/ {depositsData.monthlyTotal.toFixed(2)}</p>
                                    </div>
                                    <div className="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-left border-collapse">
                                                <thead>
                                                    <tr className="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider border-b border-slate-100">
                                                        <th className="p-4 font-bold">Fecha</th><th className="p-4 font-bold">Monto</th><th className="p-4 font-bold">Cliente</th><th className="p-4 font-bold">Actividad Destinada</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {depositsData.all.filter(d => d.isCurrentMonth).map((dep, idx) => (
                                                        <tr key={idx} className="border-b border-slate-50 hover:bg-slate-50/80 transition-colors">
                                                            <td className="p-4 text-sm text-slate-600 font-medium">{dep.fecha}</td>
                                                            <td className="p-4 text-sm font-bold text-emerald-600">S/ {parseFloat(dep.monto).toFixed(2)}</td>
                                                            <td className="p-4 text-sm text-slate-800 font-semibold">{dep.cliente}</td>
                                                            <td className="p-4 text-sm text-slate-600 max-w-xs truncate">{dep.actividad}</td>
                                                        </tr>
                                                    ))}
                                                    {depositsData.all.filter(d => d.isCurrentMonth).length === 0 && (
                                                        <tr><td colSpan="4" className="p-8 text-center text-slate-400 italic">No hay abonos registrados para este mes.</td></tr>
                                                    )}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            )}

                        </main>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
