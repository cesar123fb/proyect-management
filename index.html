<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DesignManager Pro</title>
    
    <!-- TailwindCSS para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome para los íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase (Versión Compat para HTML simple) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    
    <!-- React y ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel para compilar React en el navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Chart.js para gráficas interactivas -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- CONFIGURACIÓN: Forzamos el modo clásico para evitar el error de jsx-runtime -->
    <script>
        Babel.registerPreset('react-classic', {
            presets: [
                [Babel.availablePresets['react'], { runtime: 'classic' }]
            ]
        });
    </script>

    <style>
        @media print {
            body { background-color: white !important; }
            .print\:hidden { display: none !important; }
            .print\:block { display: block !important; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
    
    <div id="root"></div>

    <script type="text/babel" data-presets="react-classic">
        const { useState, useMemo, useEffect } = React;

        // --- CONFIGURACIÓN DE FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyAe0UIel7Q-0LJZhH4mexFA2KqXpP5xU_M",
            authDomain: "proyect-management-c27ab.firebaseapp.com",
            projectId: "proyect-management-c27ab",
            storageBucket: "proyect-management-c27ab.firebasestorage.app",
            messagingSenderId: "205245994641",
            appId: "1:205245994641:web:6526e83a61bc2771501130",
            measurementId: "G-FFWQE1M6XE"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();
        const appId = 'mi-app-diseno';

        function App() {
            // Estados Principales
            const [orders, setOrders] = useState([]);
            const [clientsList, setClientsList] = useState([]);
            const [activitiesList, setActivitiesList] = useState([]);
            const [user, setUser] = useState(null);
            const [authChecking, setAuthChecking] = useState(true);
            const [loadingData, setLoadingData] = useState(false);
            
            // Estados de Login
            const [authEmail, setAuthEmail] = useState('');
            const [authPassword, setAuthPassword] = useState('');
            const [isRegistering, setIsRegistering] = useState(false);
            const [authError, setAuthError] = useState('');

            const [modal, setModal] = useState({ isOpen: false, type: '', message: '', data: null, actionType: '' });
            const [activityModal, setActivityModal] = useState({ isOpen: false, date: '', desc: '', horas: '', ordenId: '' });

            const [view, setView] = useState('dashboard');
            const [searchTerm, setSearchTerm] = useState('');
            const [editingId, setEditingId] = useState(null);
            const [clientToPrint, setClientToPrint] = useState(null);
            
            // Filtros restaurados
            const [statusFilter, setStatusFilter] = useState('Todos');
            const [ordersClientFilter, setOrdersClientFilter] = useState('Todos');
            const [showFinances, setShowFinances] = useState(true);
            const [financeClientFilter, setFinanceClientFilter] = useState('Todos');
            const [dashboardServiceFilter, setDashboardServiceFilter] = useState('Todos');
            const [financeToPrint, setFinanceToPrint] = useState(null);

            const [isSaving, setIsSaving] = useState(false);
            const [calendarDate, setCalendarDate] = useState(new Date());
            const [incomeMonth, setIncomeMonth] = useState(new Date().toISOString().slice(0, 7));

            // Formularios (Sin teléfono ni imágenes)
            const [formData, setFormData] = useState({
                cliente: '', empresa: '', servicio: '', extras: '',
                costoTotal: '', depositos: [], estado: 'Pendiente',
                fechaSolicitud: new Date().toISOString().split('T')[0],
                fechaEntrega: '',
                tipoServicio: 'Diseños',
                tiempoSolicitud: '', fechaConclusion: ''
            });

            const [clientFormData, setClientFormData] = useState({
                nombre: '', empresas: ['']
            });

            // Control de Autenticación (Sistema de Login real)
            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged((currentUser) => {
                    setUser(currentUser);
                    setAuthChecking(false);
                });
                return () => unsubscribe();
            }, []);

            // Cargar datos desde Firestore
            useEffect(() => {
                if (!user) return;
                setLoadingData(true);
                
                const ordersRef = db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('orders');
                const unsubscribeOrders = ordersRef.onSnapshot((snapshot) => {
                    const fetchedOrders = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    fetchedOrders.sort((a, b) => b.id.localeCompare(a.id));
                    setOrders(fetchedOrders);
                }, (error) => console.error(error));

                const clientsRef = db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('clients');
                const unsubscribeClients = clientsRef.onSnapshot((snapshot) => {
                    const fetchedClients = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            // Efecto para inicializar/actualizar la Gráfica Interactiva
            useEffect(() => {
                if (view === 'dashboard' && !loadingData) {
                    const ctx = document.getElementById('dashboardChart');
                    if (ctx) {
                        const existingChart = Chart.getChart(ctx);
                        if (existingChart) existingChart.destroy();

                        const statusCounts = { Normales: 0, Urgentes: 0, Completado: 0, Cancelado: 0 };
                        const today = new Date();
                        today.setHours(0,0,0,0);

                        orders.forEach(o => {
                            if (o.estado === 'Completado') statusCounts.Completado++;
                            else if (o.estado === 'Cancelado') statusCounts.Cancelado++;
                            else if (o.estado === 'Pendiente') {
                                if (o.fechaEntrega) {
                                    const [y, m, d] = o.fechaEntrega.split('-');
                                    const delDate = new Date(y, m-1, d);
                                    const diffTime = delDate - today;
                                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                                    
                                    if (diffDays <= 3) statusCounts.Urgentes++;
                                    else statusCounts.Normales++;
                                } else {
                                    statusCounts.Normales++; // Sin fecha cuenta como normal
                                }
                            }
                        });

                        new Chart(ctx, {
                            type: 'bar',
                            data: {
                                labels: ['🔵 A tiempo', '⚠️ Por Vencer / Vencido', '🟢 Completados', '🔴 Cancelados'],
                                datasets: [{
                                    label: 'Cantidad de Órdenes',
                                    data: [statusCounts.Normales, statusCounts.Urgentes, statusCounts.Completado, statusCounts.Cancelado],
                                    backgroundColor: ['#3b82f6', '#f59e0b', '#10b981', '#ef4444'],
                                    borderRadius: 8,
                                    borderWidth: 1
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                plugins: {
                                    legend: { display: false }
                                },
                                scales: {
                                    y: { beginAtZero: true, ticks: { stepSize: 1 } }
                                }
                            }
                        });
                    }
                }
            }, [view, orders, loadingData]);

            const handleAuth = async (e) => {
                e.preventDefault();
                setAuthError('');
                try {
                    if (isRegistering) {
                        await auth.createUserWithEmailAndPassword(authEmail, authPassword);
                    } else {
                        await auth.signInWithEmailAndPassword(authEmail, authPassword);
                    }
                } catch (error) {
                    if (error.code === 'auth/email-already-in-use') setAuthError('Este correo ya está registrado.');
                    else if (error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') setAuthError('Correo o contraseña incorrectos.');
                    else if (error.code === 'auth/user-not-found') setAuthError('Usuario no encontrado.');
                    else if (error.code === 'auth/weak-password') setAuthError('La contraseña debe tener al menos 6 caracteres.');
                    else if (error.code === 'auth/operation-not-allowed') setAuthError('Habilite el método Correo/Contraseña en Firebase.');
                    else setAuthError('Ocurrió un error: ' + error.message);
                }
            };

            const stats = useMemo(() => {
                const clientsCount = clientsList.length;
                const activeCount = orders.filter(o => o.estado === 'Pendiente').length;
                const completedCount = orders.filter(o => o.estado === 'Completado').length;
                const cancelledCount = orders.filter(o => o.estado === 'Cancelado').length;
                return { clientsCount, activeCount, completedCount, cancelledCount };
            }, [orders, clientsList]);

            const clientsWithStats = useMemo(() => {
                return clientsList.map(client => {
                    const clientOrders = orders.filter(o => o.cliente === client.nombre);
                    const totalPedidos = clientOrders.length;
                    const saldoPendiente = clientOrders.filter(o => o.estado === 'Pendiente').reduce((sum, o) => sum + (o.costoTotal - o.adelanto), 0);
                    return { ...client, totalPedidos, saldoPendiente, ordenes: clientOrders };
                });
            }, [clientsList, orders]);

            const goTo = (newView) => { setView(newView); setSearchTerm(''); };

            const handleNewOrder = () => {
                setFormData({
                    cliente: '', empresa: '', servicio: '', extras: '', costoTotal: '',
                    depositos: [], estado: 'Pendiente',
                    fechaSolicitud: new Date().toISOString().split('T')[0],
                    fechaEntrega: '',
                    tipoServicio: 'Diseños', tiempoSolicitud: '', fechaConclusion: ''
                });
                setEditingId(null);
                goTo('form');
            };

            const handleEditOrder = (order) => {
                setFormData({ ...order, depositos: order.depositos || [] });
                setEditingId(order.id);
                goTo('form');
            };

            const handleChangeOrder = (e) => {
                const { name, value } = e.target;
                if (name === 'cliente') {
                    const selectedClient = clientsList.find(c => c.nombre === value);
                    setFormData(prev => ({ ...prev, cliente: value, empresa: '' }));
                } else {
                    setFormData(prev => ({ ...prev, [name]: value }));
                }
            };

            const handleSaveOrder = async (e) => {
                e.preventDefault();
                if (isSaving) return;

                if (!formData.cliente || !formData.servicio || !formData.costoTotal) {
                    setModal({ isOpen: true, type: 'alert', message: 'Por favor, llena los campos obligatorios.' }); 
                    return;
                }

                setIsSaving(true);
                const totalAdelanto = (formData.depositos || []).reduce((sum, dep) => sum + (parseFloat(dep.monto) || 0), 0);
                const orderData = { ...formData, costoTotal: parseFloat(formData.costoTotal) || 0, adelanto: totalAdelanto };

                try {
                    const newId = editingId || `ORD-${Math.floor(Math.random() * 10000).toString().padStart(4, '0')}`;
                    await db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('orders').doc(newId).set({ ...orderData, id: newId });
                    goTo('orders');
                } catch (error) {
                    setModal({ isOpen: true, type: 'alert', message: 'Ocurrió un error al guardar.' });
                } finally {
                    setIsSaving(false);
                }
            };

            const handleNewClient = () => {
                setClientFormData({ nombre: '', empresas: [''] });
                setEditingId(null);
                goTo('client-form');
            };

            const handleEditClient = (client) => {
                setClientFormData({ nombre: client.nombre, empresas: client.empresas && client.empresas.length > 0 ? client.empresas : [''] });
                setEditingId(client.id);
                goTo('client-form');
            };

            const handleClientChange = (e) => {
                const { name, value } = e.target;
                setClientFormData(prev => ({ ...prev, [name]: value }));
            };

            const handleAddEmpresa = () => setClientFormData(prev => ({ ...prev, empresas: [...prev.empresas, ''] }));
            const handleEmpresaChange = (index, value) => {
                const newEmpresas = [...clientFormData.empresas];
                newEmpresas[index] = value;
                setClientFormData(prev => ({ ...prev, empresas: newEmpresas }));
            };
            const handleRemoveEmpresa = (index) => setClientFormData(prev => ({ ...prev, empresas: prev.empresas.filter((_, i) => i !== index) }));

            const handleSaveClient = async (e) => {
                e.preventDefault();
                if (!clientFormData.nombre) { setModal({ isOpen: true, type: 'alert', message: 'El nombre es obligatorio.' }); return; }
                const cleanEmpresas = clientFormData.empresas.filter(emp => emp.trim() !== '');
                const clientData = { nombre: clientFormData.nombre, empresas: cleanEmpresas };

                try {
                    const newId = editingId || `CLI-${Math.floor(Math.random() * 10000).toString().padStart(4, '0')}`;
                    await db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('clients').doc(newId).set({ ...clientData, id: newId });
                    goTo('clients');
                } catch (error) { setModal({ isOpen: true, type: 'alert', message: 'Error al guardar.' }); }
            };

            const openActivityModal = (dateStr) => {
                setActivityModal({ isOpen: true, date: dateStr, desc: '', horas: '', ordenId: '' });
            };

            const handleSaveActivity = async () => {
                if (!activityModal.desc) return;
                try {
                    const newId = `ACT-${Math.floor(Math.random() * 100000)}`;
                    await db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('activities').doc(newId).set({
                        id: newId,
                        fecha: activityModal.date,
                        descripcion: activityModal.desc,
                        horas: parseFloat(activityModal.horas) || 0,
                        ordenId: activityModal.ordenId
                    });
                    setActivityModal({ ...activityModal, isOpen: false });
                } catch(error) {
                    console.error(error);
                }
            };

            const requestDelete = (e, type, id) => {
                e.stopPropagation();
                let message = '¿Deseas eliminar este registro?';
                if (type === 'order') message = '¿Deseas eliminar esta orden?';
                if (type === 'client') message = '¿Deseas eliminar a este cliente?';
                if (type === 'activity') message = '¿Deseas eliminar esta actividad del calendario?';

                setModal({ isOpen: true, type: 'confirm', message, data: id, actionType: type });
            };

            const confirmModalAction = async () => {
                if (modal.type === 'confirm' && modal.data && user) {
                    try {
                        let collectionName = 'orders';
                        if (modal.actionType === 'client') collectionName = 'clients';
                        if (modal.actionType === 'activity') collectionName = 'activities';

                        await db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection(collectionName).doc(modal.data).delete();
                    } catch (error) {}
                }
                setModal({ isOpen: false, type: '', message: '', data: null, actionType: '' });
            };

            const handlePrint = (client) => setClientToPrint(client); 
            const handlePrintFinance = (type) => setFinanceToPrint(type);

            useEffect(() => {
                if (clientToPrint || financeToPrint) {
                    const timer = setTimeout(() => {
                        window.print();
                        if (clientToPrint) setClientToPrint(null);
                        if (financeToPrint) setFinanceToPrint(null);
                    }, 800);
                    return () => clearTimeout(timer);
                }
            }, [clientToPrint, financeToPrint]);

            const handleAddDeposito = () => setFormData(prev => ({...prev, depositos: [...(prev.depositos || []), { monto: '', fecha: new Date().toISOString().split('T')[0] }]}));
            const handleDepositoChange = (index, field, value) => {
                const newDepositos = [...(formData.depositos || [])];
                newDepositos[index] = { ...newDepositos[index], [field]: value };
                setFormData(prev => ({ ...prev, depositos: newDepositos }));
            };
            const handleRemoveDeposito = (index) => setFormData(prev => ({ ...prev, depositos: (prev.depositos || []).filter((_, i) => i !== index) }));

            // --- FILTROS RESTAURADOS ---
            const filteredOrders = orders.filter(o => 
                (statusFilter === 'Todos' || o.estado === statusFilter) &&
                (ordersClientFilter === 'Todos' || o.cliente === ordersClientFilter) &&
                (o.cliente.toLowerCase().includes(searchTerm.toLowerCase()) || o.servicio.toLowerCase().includes(searchTerm.toLowerCase()) || o.id.toLowerCase().includes(searchTerm.toLowerCase()))
            );

            const filteredClients = clientsWithStats.filter(c => c.nombre.toLowerCase().includes(searchTerm.toLowerCase()));
            const formTotalAdelanto = (formData.depositos || []).reduce((sum, dep) => sum + (parseFloat(dep.monto) || 0), 0);
            const selectedClientData = clientsList.find(c => c.nombre === formData.cliente);
            const clientCompanies = selectedClientData?.empresas || [];

            const financeFilterOptions = useMemo(() => {
                const options = new Set();
                orders.forEach(o => {
                    if (o.cliente) options.add(o.cliente);
                    if (o.cliente && o.empresa) options.add(`${o.cliente} - ${o.empresa}`);
                });
                return Array.from(options).sort();
            }, [orders]);

            const isFinanceMatch = (o) => {
                if (financeClientFilter === 'Todos') return true;
                if (financeClientFilter.includes(' - ')) {
                    const [cName, cEmp] = financeClientFilter.split(' - ');
                    return o.cliente === cName && o.empresa === cEmp;
                }
                return o.cliente === financeClientFilter;
            };

            const depositsData = useMemo(() => {
                const allDeps = [];
                let monthlyTotal = 0;
                orders.forEach(o => {
                    if (o.depositos) {
                        o.depositos.forEach(dep => {
                            const depDate = dep.fecha || '';
                            const isCurrentMonth = depDate.startsWith(incomeMonth);
                            if (isCurrentMonth) monthlyTotal += parseFloat(dep.monto) || 0;
                            allDeps.push({
                                ...dep,
                                isCurrentMonth,
                                ordenId: o.id,
                                cliente: o.cliente,
                                actividad: o.servicio
                            });
                        });
                    }
                });
                allDeps.sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
                return { all: allDeps, monthlyTotal };
            }, [orders, incomeMonth]);

            const firstDayOfMonth = new Date(calendarDate.getFullYear(), calendarDate.getMonth(), 1).getDay();
            const daysInMonth = new Date(calendarDate.getFullYear(), calendarDate.getMonth() + 1, 0).getDate();
            const prevMonth = () => setCalendarDate(new Date(calendarDate.getFullYear(), calendarDate.getMonth() - 1, 1));
            const nextMonth = () => setCalendarDate(new Date(calendarDate.getFullYear(), calendarDate.getMonth() + 1, 1));
            
            const calendarDays = Array.from({ length: daysInMonth }, (_, i) => {
                const day = i + 1;
                const dateStr = `${calendarDate.getFullYear()}-${String(calendarDate.getMonth() + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const dayOrders = orders.filter(o => o.estado === 'Pendiente' && o.fechaSolicitud === dateStr);
                const dayActivities = activitiesList.filter(a => a.fecha === dateStr);
                return { day, dateStr, dayOrders, dayActivities };
            });

            // Pantalla de Carga
            if (authChecking || loadingData) {
                return (
                    <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-center text-indigo-600">
                        <i className="fa-solid fa-circle-notch fa-spin text-4xl mb-4"></i>
                        <p className="font-medium text-slate-600">Cargando DesignManager Pro...</p>
                    </div>
                );
            }

            // PANTALLA DE LOGIN
            if (!user) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-indigo-50 to-slate-100 flex items-center justify-center p-4">
                        <div className="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden">
                            <div className="bg-indigo-600 p-8 text-center">
                                <i className="fa-solid fa-briefcase text-white text-4xl mb-3"></i>
                                <h1 className="text-2xl font-bold text-white">DesignManager Pro</h1>
                                <p className="text-indigo-200 mt-2 text-sm">Gestiona tus órdenes y finanzas</p>
                            </div>
                            <div className="p-8">
                                <h2 className="text-xl font-bold text-slate-800 mb-6 text-center">
                                    {isRegistering ? 'Crear Nueva Cuenta' : 'Iniciar Sesión'}
                                </h2>
                                {authError && (
                                    <div className="bg-red-50 text-red-600 p-3 rounded-lg text-sm mb-4 border border-red-100 flex items-start gap-2">
                                        <i className="fa-solid fa-circle-exclamation mt-0.5"></i>
                                        <span>{authError}</span>
                                    </div>
                                )}
                                <form onSubmit={handleAuth} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1 uppercase tracking-wide">Correo Electrónico</label>
                                        <input type="email" required value={authEmail} onChange={(e) => setAuthEmail(e.target.value)} className="w-full px-4 py-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all" placeholder="tu@correo.com" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1 uppercase tracking-wide">Contraseña</label>
                                        <input type="password" required value={authPassword} onChange={(e) => setAuthPassword(e.target.value)} className="w-full px-4 py-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all" placeholder="••••••••" />
                                    </div>
                                    <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg transition-colors shadow-md mt-2">
                                        {isRegistering ? 'Registrarse' : 'Entrar al Sistema'}
                                    </button>
                                </form>
                                <div className="mt-6 text-center text-sm text-slate-500 border-t border-slate-100 pt-6">
                                    {isRegistering ? '¿Ya tienes una cuenta? ' : '¿No tienes cuenta? '}
                                    <button type="button" onClick={() => { setIsRegistering(!isRegistering); setAuthError(''); }} className="text-indigo-600 font-bold hover:underline">
                                        {isRegistering ? 'Inicia Sesión' : 'Regístrate aquí'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen">
                    
                    {/* Modales */}
                    {modal.isOpen && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                            <div className="bg-white rounded-xl shadow-xl max-w-md w-full p-6">
                                <div className="flex items-center gap-3 mb-4">
                                    {modal.type === 'alert' ? <i className="fa-solid fa-circle-exclamation text-orange-500 text-2xl"></i> : <i className="fa-solid fa-circle-exclamation text-red-500 text-2xl"></i>}
                                    <h3 className="text-lg font-bold text-slate-800">{modal.type === 'alert' ? 'Aviso' : 'Confirmar Acción'}</h3>
                                </div>
                                <p className="text-slate-600 mb-6">{modal.message}</p>
                                <div className="flex justify-end gap-3">
                                    {modal.type === 'confirm' && (<button onClick={() => setModal({ isOpen: false })} className="px-4 py-2 rounded-lg text-slate-600 font-medium hover:bg-slate-100 transition-colors">Cancelar</button>)}
                                    <button onClick={confirmModalAction} className={`px-4 py-2 rounded-lg font-medium text-white transition-colors ${modal.type === 'alert' ? 'bg-indigo-600 hover:bg-indigo-700' : 'bg-red-600 hover:bg-red-700'}`}>{modal.type === 'alert' ? 'Entendido' : 'Sí, eliminar'}</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal Actividad Calendario */}
                    {activityModal.isOpen && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[100] flex items-center justify-center p-4" onClick={() => setActivityModal({...activityModal, isOpen: false})}>
                            <div className="bg-white rounded-xl shadow-xl max-w-md w-full p-6" onClick={(e) => e.stopPropagation()}>
                                <h3 className="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                                    <i className="fa-solid fa-clock-rotate-left text-emerald-500"></i> Registrar Actividad / Visita
                                </h3>
                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">Fecha</label>
                                        <input type="text" readOnly value={activityModal.date} className="w-full border border-slate-200 bg-slate-50 p-2 rounded-lg text-sm font-medium" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">Descripción de la tarea *</label>
                                        <input type="text" value={activityModal.desc} onChange={(e) => setActivityModal({...activityModal, desc: e.target.value})} className="w-full border border-slate-200 focus:ring-2 focus:ring-emerald-500 outline-none p-2 rounded-lg text-sm" placeholder="Ej: Visita técnica, mantenimiento..." />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">Horas Invertidas</label>
                                        <input type="number" step="0.5" min="0" value={activityModal.horas} onChange={(e) => setActivityModal({...activityModal, horas: e.target.value})} className="w-full border border-slate-200 focus:ring-2 focus:ring-emerald-500 outline-none p-2 rounded-lg text-sm" placeholder="Ej: 3" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">Vincular a Proyecto (Opcional)</label>
                                        <select value={activityModal.ordenId} onChange={(e) => setActivityModal({...activityModal, ordenId: e.target.value})} className="w-full border border-slate-200 focus:ring-2 focus:ring-emerald-500 outline-none p-2 rounded-lg text-sm bg-white">
                                            <option value="">-- Sin vincular --</option>
                                            {orders.filter(o => o.estado === 'Pendiente').map(o => (
                                                <option key={o.id} value={o.id}>{o.cliente} - {o.servicio.substring(0,25)}...</option>
                                            ))}
                                        </select>
                                    </div>
                                </div>
                                <div className="flex justify-end gap-3 mt-6 pt-4 border-t border-slate-100">
                                    <button onClick={() => setActivityModal({...activityModal, isOpen: false})} className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-sm font-bold transition-colors">Cancelar</button>
                                    <button onClick={handleSaveActivity} disabled={!activityModal.desc} className={`px-4 py-2 text-white rounded-lg text-sm font-bold transition-colors ${!activityModal.desc ? 'bg-slate-300 cursor-not-allowed' : 'bg-emerald-600 hover:bg-emerald-700'}`}>Guardar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Vistas de Impresión PDF */}
                    {clientToPrint && (
                        <div className="hidden print:block absolute top-0 left-0 w-full bg-white p-8 z-50">
                            <div className="border-b-2 border-indigo-600 pb-6 mb-6 flex justify-between items-end">
                                <div><h1 className="text-3xl font-bold text-slate-800">Estado de Cuenta</h1><p className="text-slate-500 mt-1">DesignManager Pro</p></div>
                                <div className="text-right"><p className="font-bold text-slate-800">{clientToPrint.nombre}</p><p className="text-slate-500">Fecha: {new Date().toLocaleDateString()}</p></div>
                            </div>
                            <table className="w-full text-left border-collapse">
                                <thead>
                                    <tr className="bg-slate-100 text-slate-700">
                                        <th className="p-3 border-b">ID / Empresa</th><th className="p-3 border-b">Actividad</th><th className="p-3 border-b text-right">Total</th><th className="p-3 border-b text-right">Abonado</th><th className="p-3 border-b text-right font-bold">Pendiente</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {clientToPrint.ordenes.filter(o => o.estado === 'Pendiente').map(o => (
                                        <tr key={o.id} className="border-b">
                                            <td className="p-3 text-sm text-slate-600">{o.id} {o.empresa && <span>({o.empresa})</span>}</td>
                                            <td className="p-3 text-sm text-slate-800">{o.servicio}</td>
                                            <td className="p-3 text-sm text-right">S/ {o.costoTotal.toFixed(2)}</td>
                                            <td className="p-3 text-sm text-right text-emerald-600">S/ {o.adelanto.toFixed(2)}</td>
                                            <td className="p-3 text-sm text-right font-bold text-orange-600">S/ {(o.costoTotal - o.adelanto).toFixed(2)}</td>
                                        </tr>
                                    ))}
                                </tbody>
                                <tfoot><tr className="bg-slate-50"><td colSpan="4" className="p-3 text-right font-bold text-slate-700">TOTAL:</td><td className="p-3 text-right font-bold text-xl text-indigo-600">S/ {clientToPrint.saldoPendiente.toFixed(2)}</td></tr></tfoot>
                            </table>
                        </div>
                    )}

                    {/* PDF de Finanzas */}
                    {financeToPrint && (
                        <div className="hidden print:block absolute top-0 left-0 w-full bg-white p-8 z-50">
                            <div className="border-b-2 border-indigo-600 pb-6 mb-6 flex justify-between items-end">
                                <div><h1 className="text-3xl font-bold text-slate-800">{financeToPrint === 'pending' ? 'Reporte de Saldos Pendientes' : 'Reporte Financiero Completo'}</h1></div>
                                <div className="text-right"><p className="font-bold text-slate-800">Filtro: {financeClientFilter}</p><p className="text-slate-500">Fecha: {new Date().toLocaleDateString()}</p></div>
                            </div>
                            <table className="w-full text-left border-collapse">
                                <thead>
                                    <tr className="bg-slate-100 text-slate-700">
                                        <th className="p-3 border-b">Cliente</th><th className="p-3 border-b">Actividad</th><th className="p-3 border-b text-right">Facturado</th><th className="p-3 border-b text-right">Abonado</th><th className="p-3 border-b text-right font-bold">Pendiente</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {orders.filter(isFinanceMatch).filter(o => financeToPrint === 'pending' ? (o.costoTotal - o.adelanto) > 0 : true).map(o => (
                                        <tr key={o.id} className="border-b">
                                            <td className="p-3 text-sm font-bold text-slate-700">{o.cliente} {o.empresa && <span className="text-xs font-normal block text-slate-500">{o.empresa}</span>}</td>
                                            <td className="p-3 text-sm text-slate-800">{o.servicio}</td>
                                            <td className="p-3 text-sm text-right">S/ {o.costoTotal.toFixed(2)}</td>
                                            <td className="p-3 text-sm text-right text-emerald-600">S/ {o.adelanto.toFixed(2)}</td>
                                            <td className="p-3 text-sm text-right font-bold text-orange-600">S/ {(o.costoTotal - o.adelanto).toFixed(2)}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    )}

                    {/* INTERFAZ GENERAL */}
                    <div className="print:hidden">
                        <nav className="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-40">
                            <div className="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
                                <div className="flex items-center gap-2 cursor-pointer" onClick={() => goTo('dashboard')}>
                                    <i className="fa-solid fa-briefcase text-2xl"></i>
                                    <h1 className="text-xl font-bold">DesignManager Pro</h1>
                                </div>
                                <div className="flex items-center gap-4">
                                    <div className="flex bg-indigo-700 rounded-lg p-1 overflow-x-auto">
                                        <button onClick={() => goTo('dashboard')} className={`px-4 py-2 rounded-md flex items-center gap-2 text-sm font-medium transition-colors ${view === 'dashboard' ? 'bg-white text-indigo-700 shadow' : 'text-indigo-100 hover:text-white hover:bg-indigo-600'}`}>
                                            <i className="fa-solid fa-table-cells-large"></i> <span>Índice</span>
                                        </button>
                                        <button onClick={() => goTo('calendar')} className={`px-4 py-2 rounded-md flex items-center gap-2 text-sm font-medium transition-colors ${view === 'calendar' ? 'bg-white text-indigo-700 shadow' : 'text-indigo-100 hover:text-white hover:bg-indigo-600'}`}>
                                            <i className="fa-solid fa-calendar-days"></i> <span>Calendario</span>
                                        </button>
                                        <button onClick={() => goTo('orders')} className={`px-4 py-2 rounded-md flex items-center gap-2 text-sm font-medium transition-colors ${view === 'orders' || view === 'form' ? 'bg-white text-indigo-700 shadow' : 'text-indigo-100 hover:text-white hover:bg-indigo-600'}`}>
                                            <i className="fa-solid fa-file-lines"></i> <span>Órdenes</span>
                                        </button>
                                        <button onClick={() => goTo('clients')} className={`px-4 py-2 rounded-md flex items-center gap-2 text-sm font-medium transition-colors ${view === 'clients' || view === 'client-form' ? 'bg-white text-indigo-700 shadow' : 'text-indigo-100 hover:text-white hover:bg-indigo-600'}`}>
                                            <i className="fa-solid fa-users"></i> <span>Clientes</span>
                                        </button>
                                        <button onClick={() => goTo('finances')} className={`px-4 py-2 rounded-md flex items-center gap-2 text-sm font-medium transition-colors ${view === 'finances' ? 'bg-white text-indigo-700 shadow' : 'text-indigo-100 hover:text-white hover:bg-indigo-600'}`}>
                                            <i className="fa-solid fa-chart-pie"></i> <span>Finanzas</span>
                                        </button>
                                        <button onClick={() => goTo('income')} className={`px-4 py-2 rounded-md flex items-center gap-2 text-sm font-medium transition-colors ${view === 'income' ? 'bg-white text-indigo-700 shadow' : 'text-indigo-100 hover:text-white hover:bg-indigo-600'}`}>
                                            <i className="fa-solid fa-money-bill-wave"></i> <span>Ingresos</span>
                                        </button>
                                    </div>
                                    <button onClick={() => auth.signOut()} class="text-indigo-200 hover:text-white bg-indigo-800 p-2 rounded-lg transition-colors"><i class="fa-solid fa-right-from-bracket"></i></button>
                                </div>
                            </div>
                        </nav>

                        <main className="max-w-6xl mx-auto p-4 mt-4">
                            
                            {/* ÍNDICE / DASHBOARD */}
                            {view === 'dashboard' && (
                                <div className="space-y-6">
                                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                                        <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-100 border-l-4 border-l-indigo-500"><p className="text-sm text-slate-500 font-medium">Clientes</p><p className="text-2xl font-bold">{stats.clientsCount}</p></div>
                                        <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-100 border-l-4 border-l-orange-500"><p className="text-sm text-slate-500 font-medium">Pendientes</p><p className="text-2xl font-bold">{stats.activeCount}</p></div>
                                        <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-100 border-l-4 border-l-emerald-500"><p className="text-sm text-slate-500 font-medium">Completados</p><p className="text-2xl font-bold">{stats.completedCount}</p></div>
                                        <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-100 border-l-4 border-l-red-500"><p className="text-sm text-slate-500 font-medium">Cancelados</p><p className="text-2xl font-bold">{stats.cancelledCount}</p></div>
                                    </div>

                                    {/* Gráfica Interactiva */}
                                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                                        <h3 className="text-lg font-bold text-slate-700 mb-4 flex items-center gap-2"><i className="fa-solid fa-chart-simple text-indigo-500"></i> Estado General del Negocio</h3>
                                        <div className="h-64 relative">
                                            <canvas id="dashboardChart"></canvas>
                                        </div>
                                    </div>

                                    {/* Lista Rápida */}
                                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                                        <div className="flex justify-between items-center mb-4">
                                            <h3 className="text-lg font-bold text-slate-700">Vista de Proyectos</h3>
                                            <select value={dashboardServiceFilter} onChange={(e) => setDashboardServiceFilter(e.target.value)} className="p-2 border border-slate-200 rounded-lg text-sm bg-slate-50 text-slate-600 font-medium">
                                                <option value="Todos">Todos los servicios</option>
                                                <option value="Logística">Logística</option><option value="Reingeniería">Reingeniería</option><option value="Diseños">Diseños</option><option value="Visitas Técnicas">Visitas Técnicas</option><option value="Delivery">Delivery</option><option value="Calidad">Calidad</option><option value="Ingeniería">Ingeniería</option>
                                            </select>
                                        </div>
                                        <div className="grid gap-4 md:grid-cols-2">
                                            {orders.filter(o => o.estado === 'Pendiente' && (dashboardServiceFilter === 'Todos' || o.tipoServicio === dashboardServiceFilter)).map((o, idx) => {
                                                let isUrgent = false;
                                                let isLate = false;
                                                if (o.fechaEntrega) {
                                                    const today = new Date();
                                                    today.setHours(0,0,0,0);
                                                    const [y, m, d] = o.fechaEntrega.split('-');
                                                    const delDate = new Date(y, m-1, d);
                                                    const diffDays = Math.ceil((delDate - today) / (1000 * 60 * 60 * 24));
                                                    if (diffDays < 0) isLate = true;
                                                    else if (diffDays <= 3) isUrgent = true;
                                                }

                                                return (
                                                <div key={o.id} className={`p-4 border rounded-xl cursor-pointer transition-colors ${isLate ? 'border-red-300 bg-red-50/50 hover:bg-red-50' : isUrgent ? 'border-orange-300 bg-orange-50/50 hover:bg-orange-50' : 'border-slate-100 bg-slate-50/50 hover:bg-slate-50'}`} onClick={() => handleEditOrder(o)}>
                                                    <div className="flex justify-between items-start">
                                                        <span className={`text-xs font-bold px-2 py-0.5 rounded ${isLate ? 'text-red-700 bg-red-100' : isUrgent ? 'text-orange-700 bg-orange-100' : 'text-blue-600 bg-blue-100'}`}>N° {idx+1} {isLate ? ' - Vencido' : isUrgent ? ' - Por Vencer' : ''}</span>
                                                    </div>
                                                    <h4 className="text-lg font-bold text-slate-800 mt-1 leading-tight">{o.servicio}</h4>
                                                    <p className="text-sm text-slate-500 mt-1">Cliente: <span className="font-semibold text-slate-700">{o.cliente}</span> {o.empresa && ` - ${o.empresa}`}</p>
                                                    <div className="text-xs text-slate-400 mt-2 flex justify-between items-center">
                                                        <span>Tipo: {o.tipoServicio}</span> 
                                                        {o.fechaEntrega && <span className={isLate ? 'text-red-600 font-bold' : isUrgent ? 'text-orange-600 font-bold' : ''}><i className="fa-regular fa-clock"></i> Entrega: {o.fechaEntrega}</span>}
                                                    </div>
                                                </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* CALENDARIO */}
                            {view === 'calendar' && (
                                <div className="space-y-6">
                                    <div className="flex flex-col sm:flex-row justify-between items-center gap-4 bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                                        <h2 className="text-xl font-bold text-slate-700 flex items-center gap-2"><i className="fa-solid fa-calendar-days text-indigo-500"></i> Calendario de Actividades</h2>
                                        <div className="flex items-center gap-4">
                                            <button onClick={prevMonth} className="p-2 bg-slate-100 text-slate-600 rounded-lg hover:bg-slate-200"><i className="fa-solid fa-chevron-left"></i></button>
                                            <span className="font-bold text-slate-800 capitalize w-40 text-center">{calendarDate.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' })}</span>
                                            <button onClick={nextMonth} className="p-2 bg-slate-100 text-slate-600 rounded-lg hover:bg-slate-200"><i className="fa-solid fa-chevron-right"></i></button>
                                        </div>
                                    </div>
                                    <div className="bg-white rounded-xl shadow-sm border border-slate-100 p-4">
                                        <div className="grid grid-cols-7 gap-2 mb-2 text-center font-bold text-sm text-slate-500">
                                            <div>Dom</div><div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div>
                                        </div>
                                        <div className="grid grid-cols-7 gap-2">
                                            {Array.from({ length: firstDayOfMonth }).map((_, i) => <div key={i} className="h-32 bg-slate-50 rounded-lg opacity-40"></div>)}
                                            {calendarDays.map(({ day, dateStr, dayOrders, dayActivities }) => (
                                                <div key={day} onClick={() => openActivityModal(dateStr)} className="h-32 overflow-y-auto bg-white rounded-lg border border-slate-200 p-1.5 relative group hover:border-emerald-400 transition-all cursor-pointer flex flex-col justify-between">
                                                    <div className="flex justify-between items-center mb-1">
                                                        <span className={`text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center ${dateStr === new Date().toISOString().split('T')[0] ? 'bg-indigo-600 text-white' : 'text-slate-500'}`}>{day}</span>
                                                        <i className="fa-solid fa-plus text-emerald-400 opacity-0 group-hover:opacity-100 text-[10px]"></i>
                                                    </div>
                                                    <div className="space-y-1 flex-1 overflow-y-auto">
                                                        {dayActivities.map(a => (
                                                            <div key={a.id} onClick={(e) => requestDelete(e, 'activity', a.id)} className="bg-emerald-50 border border-emerald-200 text-emerald-800 text-[9px] p-1 rounded leading-tight truncate hover:bg-red-50 hover:text-red-700" title={a.descripcion}>
                                                                <span className="font-bold">{a.horas ? `${a.horas}h ` : ''}</span>{a.descripcion}
                                                            </div>
                                                        ))}
                                                        {dayOrders.map(o => (
                                                            <div key={o.id} onClick={(e) => { e.stopPropagation(); handleEditOrder(o); }} className="bg-indigo-50 border border-indigo-200 text-indigo-800 text-[9px] p-1 rounded leading-tight truncate font-semibold" title={`Proyecto: ${o.servicio}`}>
                                                                <i className="fa-solid fa-user text-[8px] opacity-60 mr-0.5"></i>{o.cliente}
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* ÓRDENES (LISTA Y DETALLE) */}
                            {view === 'orders' && (
                                <div className="space-y-6">
                                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                                        <h2 className="text-xl font-bold text-slate-700">Listado de Órdenes</h2>
                                        
                                        {/* FILTROS RESTAURADOS AQUÍ */}
                                        <div className="flex flex-wrap sm:flex-nowrap gap-2 w-full sm:w-auto">
                                            <select value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)} className="p-2 rounded-lg border border-slate-200 text-sm font-medium text-slate-600 bg-slate-50">
                                                <option value="Todos">Todos los estados</option>
                                                <option value="Pendiente">🟡 Pendientes</option>
                                                <option value="Completado">🟢 Completados</option>
                                                <option value="Cancelado">🔴 Cancelados</option>
                                            </select>
                                            <select value={ordersClientFilter} onChange={(e) => setOrdersClientFilter(e.target.value)} className="p-2 rounded-lg border border-slate-200 text-sm font-medium text-slate-600 bg-slate-50">
                                                <option value="Todos">Todos los clientes</option>
                                                {clientsList.map(c => <option key={c.id} value={c.nombre}>{c.nombre}</option>)}
                                            </select>
                                            <div className="relative flex-1 sm:w-64">
                                                <i className="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-sm"></i>
                                                <input type="text" placeholder="Buscar orden..." className="w-full pl-9 pr-4 py-2 rounded-lg border border-slate-200 text-sm" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
                                            </div>
                                            <button onClick={handleNewOrder} className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg flex items-center gap-2 transition-colors font-semibold text-sm shadow-sm"><i className="fa-solid fa-plus"></i> Nueva</button>
                                        </div>
                                    </div>
                                    <div className="grid gap-6 md:grid-cols-2 lg:grid-cols-3">
                                        {filteredOrders.length === 0 && (
                                           <p className="text-slate-500 col-span-full text-center py-8">No se encontraron órdenes que coincidan con los filtros.</p>
                                        )}
                                        {filteredOrders.map((order, idx) => {
                                            const pendiente = order.costoTotal - order.adelanto;
                                            
                                            // Lógica de alerta por vencimiento
                                            let isUrgent = false;
                                            let isLate = false;
                                            if (order.estado === 'Pendiente' && order.fechaEntrega) {
                                                const today = new Date();
                                                today.setHours(0,0,0,0);
                                                const [y, m, d] = order.fechaEntrega.split('-');
                                                const delDate = new Date(y, m-1, d);
                                                const diffDays = Math.ceil((delDate - today) / (1000 * 60 * 60 * 24));
                                                if (diffDays < 0) isLate = true;
                                                else if (diffDays <= 3) isUrgent = true;
                                            }

                                            return (
                                                <div key={order.id} className={`bg-white rounded-2xl shadow-sm border-t-4 p-6 relative group ${order.estado === 'Pendiente' ? (isLate ? 'border-t-red-500' : isUrgent ? 'border-t-orange-400' : 'border-t-blue-400') : order.estado === 'Completado' ? 'border-t-emerald-400' : 'border-t-slate-400'} border-x border-b border-slate-100`}>
                                                    <div className="absolute top-4 right-4 flex gap-1.5 opacity-80 group-hover:opacity-100">
                                                        <button onClick={() => handleEditOrder(order)} className="p-1.5 bg-slate-50 text-slate-600 rounded-md hover:bg-indigo-50 hover:text-indigo-600"><i className="fa-solid fa-pen text-xs"></i></button>
                                                        <button onClick={(e) => requestDelete(e, 'order', order.id)} className="p-1.5 bg-slate-50 text-slate-600 rounded-md hover:bg-red-50 hover:text-red-600"><i className="fa-solid fa-trash text-xs"></i></button>
                                                    </div>
                                                    
                                                    {/* NOMBRE DEL PROYECTO (Tipografía más delgada y limpia) */}
                                                    <div className="mb-4">
                                                        <span className={`text-xs font-bold uppercase tracking-wider block ${isLate ? 'text-red-500' : isUrgent ? 'text-orange-500' : 'text-slate-400'}`}>N° {idx + 1} &bull; {order.id}</span>
                                                        <h3 className="text-lg font-bold text-slate-800 mt-1 leading-tight line-clamp-2" title={order.servicio}>{order.servicio}</h3>
                                                        <p className="text-xs text-indigo-600 font-bold bg-indigo-50 inline-block px-2 py-0.5 rounded mt-2"><i className="fa-solid fa-tag"></i> {order.tipoServicio}</p>
                                                    </div>
                                                    
                                                    {/* DETALLE CON CLIENTE Y EMPRESA */}
                                                    <div className="space-y-1.5 text-sm border-t border-slate-100 pt-3 text-slate-600">
                                                        <div className="flex justify-between"><span>Cliente:</span><span className="font-semibold text-slate-800">{order.cliente}</span></div>
                                                        {order.empresa && <div className="flex justify-between"><span>Empresa:</span><span className="font-medium text-slate-500">{order.empresa}</span></div>}
                                                        
                                                        {/* ALERTA DE FECHA DE ENTREGA */}
                                                        {order.fechaEntrega && (
                                                            <div className={`flex justify-between items-center px-2 py-1.5 rounded-md mt-1 border ${isLate ? 'bg-red-50 border-red-100 text-red-700 font-bold' : isUrgent ? 'bg-orange-50 border-orange-100 text-orange-700 font-bold' : 'bg-slate-50 border-slate-100 text-slate-600 font-medium'}`}>
                                                                <span><i className="fa-regular fa-calendar"></i> Entrega:</span>
                                                                <span>{order.fechaEntrega} {isLate ? '(Vencido)' : isUrgent ? '(Urgente)' : ''}</span>
                                                            </div>
                                                        )}

                                                        {order.tipoServicio === 'Ingeniería' && (
                                                            <div className="bg-slate-50 p-2 rounded-lg text-xs space-y-1 text-slate-500 border border-slate-100 my-2">
                                                                <div className="flex justify-between"><span>Tiempo Solicitud:</span><span className="font-bold text-indigo-600">{order.tiempoSolicitud || 'N/A'}</span></div>
                                                                <div className="flex justify-between"><span>Fecha Conclusión:</span><span className="font-bold text-slate-700">{order.fechaConclusion || 'N/A'}</span></div>
                                                            </div>
                                                        )}
                                                        <div className="flex justify-between pt-1"><span>Costo Total:</span><span className="font-bold text-slate-800">S/ {order.costoTotal.toFixed(2)}</span></div>
                                                        <div className="flex justify-between font-bold border-t border-dashed border-slate-100 pt-1.5"><span>Pendiente:</span><span className={pendiente > 0 ? "text-orange-600" : "text-emerald-600"}>S/ {pendiente.toFixed(2)}</span></div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            )}

                            {/* REGISTRO / FORMULARIO DE ÓRDENES */}
                            {view === 'form' && (
                                <div className="bg-white rounded-xl shadow-lg border border-slate-100 overflow-hidden max-w-2xl mx-auto">
                                    <div className="bg-slate-50 px-6 py-4 border-b border-slate-100 flex items-center justify-between">
                                        <div className="flex items-center gap-3">
                                            <button onClick={() => goTo('orders')} className="p-2 hover:bg-slate-200 rounded-full text-slate-500"><i className="fa-solid fa-arrow-left"></i></button>
                                            <h2 className="text-xl font-bold text-slate-700">{editingId ? 'Editar Orden' : 'Nueva Orden'}</h2>
                                        </div>
                                    </div>
                                    <form onSubmit={handleSaveOrder} className="p-6 space-y-5">
                                        <div>
                                            <label className="block text-xs font-medium text-slate-500 mb-1">Cliente *</label>
                                            <select name="cliente" required value={formData.cliente} onChange={handleChangeOrder} className="w-full p-2.5 rounded-lg border border-slate-200 bg-white">
                                                <option value="">Selecciona un cliente...</option>
                                                {clientsList.map(c => <option key={c.id} value={c.nombre}>{c.nombre}</option>)}
                                            </select>
                                        </div>
                                        {clientCompanies.length > 0 && (
                                            <div>
                                                <label className="block text-xs font-medium text-slate-500 mb-1">Empresa</label>
                                                <select name="empresa" value={formData.empresa} onChange={handleChangeOrder} className="w-full p-2.5 rounded-lg border border-slate-200 bg-white">
                                                    <option value="">Ninguna en específico</option>
                                                    {clientCompanies.map((emp, i) => <option key={i} value={emp}>{emp}</option>)}
                                                </select>
                                            </div>
                                        )}
                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-xs font-medium text-slate-500 mb-1">Tipo de Servicio *</label>
                                                <select name="tipoServicio" required value={formData.tipoServicio} onChange={handleChangeOrder} className="w-full p-2.5 rounded-lg border border-slate-200 bg-white">
                                                    <option value="Logística">Logística</option><option value="Reingeniería">Reingeniería</option><option value="Diseños">Diseños</option><option value="Visitas Técnicas">Visitas Técnicas</option><option value="Delivery">Delivery</option><option value="Calidad">Calidad</option><option value="Ingeniería">Ingeniería</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-medium text-slate-500 mb-1">Fecha de Solicitud *</label>
                                                <input type="date" name="fechaSolicitud" required value={formData.fechaSolicitud} onChange={handleChangeOrder} className="w-full p-2.5 rounded-lg border border-slate-200 bg-white" />
                                            </div>
                                        </div>

                                        <div className="bg-orange-50/50 p-3 rounded-xl border border-orange-100">
                                            <label className="block text-xs font-bold text-orange-700 mb-1"><i className="fa-regular fa-calendar-check mr-1"></i> Fecha de Entrega Esperada (Opcional)</label>
                                            <input type="date" name="fechaEntrega" value={formData.fechaEntrega || ''} onChange={handleChangeOrder} className="w-full p-2 rounded-lg border border-orange-200 bg-white text-sm outline-none focus:ring-2 focus:ring-orange-400" />
                                        </div>

                                        {/* CAMPOS CONDICIONALES EXCLUSIVOS DE INGENIERÍA */}
                                        {formData.tipoServicio === 'Ingeniería' && (
                                            <div className="grid grid-cols-2 gap-4 bg-indigo-50/70 p-4 rounded-xl border border-indigo-100 animate-fadeIn">
                                                <div>
                                                    <label className="block text-xs font-bold text-indigo-700 mb-1">Tiempo de Solicitud</label>
                                                    <input type="text" name="tiempoSolicitud" placeholder="Ej: 4 días / 12 horas" value={formData.tiempoSolicitud || ''} onChange={handleChangeOrder} className="w-full p-2 rounded-lg border border-indigo-200 bg-white text-sm outline-none focus:ring-2 focus:ring-indigo-400" />
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-bold text-indigo-700 mb-1">Fecha de Conclusión</label>
                                                    <input type="date" name="fechaConclusion" value={formData.fechaConclusion || ''} onChange={handleChangeOrder} className="w-full p-2 rounded-lg border border-indigo-200 bg-white text-sm outline-none focus:ring-2 focus:ring-indigo-400" />
                                                </div>
                                            </div>
                                        )}

                                        <div>
                                            <label className="block text-xs font-medium text-slate-500 mb-1">Actividad / Proyecto *</label>
                                            <textarea name="servicio" required rows="2" value={formData.servicio} onChange={handleChangeOrder} className="w-full p-2.5 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500" placeholder="Escribe el nombre principal de la actividad..."></textarea>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-medium text-slate-500 mb-1">Costo Total *</label>
                                            <input type="number" step="0.01" name="costoTotal" required value={formData.costoTotal} onChange={handleChangeOrder} className="w-full p-2.5 rounded-lg border border-slate-200 font-bold" />
                                        </div>

                                        {/* Sección de pagos abreviada */}
                                        <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
                                            <div className="flex justify-between items-center">
                                                <label className="block text-xs font-bold text-slate-600 uppercase tracking-wider">Abonos y Adelantos</label>
                                                <button type="button" onClick={handleAddDeposito} className="text-xs bg-indigo-100 text-indigo-700 px-3 py-1 rounded-md hover:bg-indigo-200 font-bold"><i className="fa-solid fa-plus"></i> Añadir Pago</button>
                                            </div>
                                            <div className="space-y-2">
                                                {formData.depositos?.map((dep, idx) => (
                                                    <div key={idx} className="flex gap-2 items-center bg-white p-2 rounded-lg border border-slate-200 shadow-sm">
                                                        <input type="number" placeholder="Monto S/" value={dep.monto} onChange={e => handleDepositoChange(idx, 'monto', e.target.value)} className="w-1/2 p-1.5 text-sm rounded border border-slate-200 outline-none" />
                                                        <input type="date" value={dep.fecha} onChange={e => handleDepositoChange(idx, 'fecha', e.target.value)} className="w-1/2 p-1.5 text-sm rounded border border-slate-200 outline-none" />
                                                        <button type="button" onClick={() => handleRemoveDeposito(idx)} className="text-red-400 p-1 hover:bg-red-50 rounded"><i className="fa-solid fa-trash"></i></button>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                        <div className="pt-4 border-t border-slate-100 flex justify-end gap-3">
                                            <button type="button" onClick={() => goTo('orders')} className="px-6 py-2 rounded-lg border border-slate-200 text-slate-600">Cancelar</button>
                                            <button type="submit" disabled={isSaving || clientsList.length === 0} className="px-6 py-2 rounded-lg bg-indigo-600 text-white font-medium hover:bg-indigo-700">
                                                {isSaving ? 'Guardando...' : 'Guardar Proyecto'}
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            )}

                            {/* CLIENTES (LISTA) */}
                            {view === 'clients' && (
                                <div className="space-y-6">
                                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                                        <h2 className="text-xl font-bold text-slate-700">Directorio de Clientes</h2>
                                        <button onClick={handleNewClient} className="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700"><i className="fa-solid fa-plus"></i> Nuevo Cliente</button>
                                    </div>
                                    <div className="grid gap-4 md:grid-cols-2 lg:grid-cols-3">
                                        {filteredClients.map((client) => (
                                            <div key={client.id} className="bg-white rounded-xl shadow-sm border border-slate-100 p-5 hover:border-indigo-200 relative group">
                                                <div className="absolute top-4 right-4 flex gap-1.5">
                                                    <button onClick={() => handleEditClient(client)} className="p-1 bg-slate-50 text-slate-500 rounded hover:bg-indigo-50 hover:text-indigo-600"><i className="fa-solid fa-pen text-xs"></i></button>
                                                    <button onClick={(e) => requestDelete(e, 'client', client.id)} className="p-1 bg-slate-50 text-slate-500 rounded hover:bg-red-50 hover:text-red-600"><i className="fa-solid fa-trash text-xs"></i></button>
                                                </div>
                                                <h3 className="font-bold text-lg text-slate-800">{client.nombre}</h3>
                                                <div className="my-3 space-y-1">
                                                    <p className="text-xs font-bold text-slate-400 uppercase">Empresas:</p>
                                                    <div className="flex flex-wrap gap-1">
                                                        {client.empresas?.map((emp, i) => <span key={i} className="text-xs bg-slate-100 px-2 py-0.5 rounded border border-slate-200">{emp}</span>) || <span className="text-xs text-slate-400 italic">Ninguna</span>}
                                                    </div>
                                                </div>
                                                <div className="text-sm bg-orange-50/60 p-3 rounded-xl flex justify-between items-center mb-4 border border-orange-100">
                                                    <span className="text-orange-800 font-medium text-xs">Deuda total:</span>
                                                    <span className="font-bold text-orange-600">S/ {client.saldoPendiente.toFixed(2)}</span>
                                                </div>
                                                <button onClick={() => handlePrint(client)} className="w-full bg-slate-800 text-white py-2 rounded-lg text-xs font-medium hover:bg-slate-700 flex justify-center items-center gap-1"><i className="fa-solid fa-file-pdf"></i> Estado de Cuenta (PDF)</button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* CLIENTES (FORMULARIO) */}
                            {view === 'client-form' && (
                                <div className="bg-white rounded-xl shadow-lg border border-slate-100 overflow-hidden max-w-lg mx-auto">
                                    <div className="bg-slate-50 px-6 py-4 border-b border-slate-100 flex items-center gap-3">
                                        <button onClick={() => goTo('clients')} className="p-2 hover:bg-slate-200 rounded-full text-slate-500"><i className="fa-solid fa-arrow-left"></i></button>
                                        <h2 className="text-xl font-bold text-slate-700">{editingId ? 'Editar Cliente' : 'Nuevo Cliente'}</h2>
                                    </div>
                                    <form onSubmit={handleSaveClient} className="p-6 space-y-5">
                                        <div>
                                            <label className="block text-xs font-medium text-slate-500 mb-1">Nombre Completo *</label>
                                            <input type="text" name="nombre" required className="w-full p-2.5 rounded-lg border border-slate-200" value={clientFormData.nombre} onChange={handleClientChange} />
                                        </div>
                                        <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
